name: Prepare reviewed guidebooks
on:
  workflow_dispatch:
  push:
    paths:
      - 'guidebook-sources/**'
      - 'guidebooks/**'
      - 'scripts/build-guidebooks.mjs'
      - 'src/guidebook-schema.ts'
      - 'src/guide-schema.ts'
permissions:
  contents: read
jobs:
  guidebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run guidebooks:build
      - run: npm run guidebooks:check
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-guidebooks
          path: guidebooks/
