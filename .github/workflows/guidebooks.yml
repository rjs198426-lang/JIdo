name: Prepare reviewed guidebooks
on:
  workflow_dispatch:
  push:
    paths:
      - 'guidebook-sources/**'
      - 'guidebooks/**'
      - 'scripts/build-guidebooks.mjs'
      - 'src/guidebook-schema.ts'
      - 'src/guide-schema.ts'
      - 'guidebook-database/**'
      - 'research/guidebooks/**'
      - 'scripts/build-guide-database.mjs'
      - 'scripts/plan-guide-research.mjs'
      - 'scripts/guide-database.test.mjs'
      - 'src/venue-coordinates.ts'
      - 'src/category-balance.ts'
      - 'src/data.ts'
      - 'src/*guides*'
      - 'src/*places*'
      - 'src/*notes*'
      - 'src/guide-plans.json'
      - 'src/place-*.json'
      - 'src/photo-credits.ts'
permissions:
  contents: read
jobs:
  guidebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run guidebooks:build
      - run: npm run guidebooks:check
      - run: npm run guides:db:check
      - run: node --experimental-strip-types --test --test-isolation=none scripts/guide-database.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-guidebooks
          path: |
            guidebooks/
            guidebook-database/
