name: Archived guidebook validation (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guidebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run guidebooks:build
      - run: npm run guidebooks:check
      - run: npm run guides:db:check
      - run: node --experimental-strip-types --test --test-isolation=none scripts/guide-database.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-guidebooks
          path: |
            guidebooks/
            guidebook-database/
